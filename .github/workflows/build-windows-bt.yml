name: Build chiaki-ng Windows x86_64 BT (VC)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-win_x64:
    name: Build chiaki-ng win_x64 (VC)
    runs-on: windows-latest
    env:
      CC: clang-cl.exe
      CXX: clang-cl.exe
      VULKAN_SDK: C:\VulkanSDK\
      triplet: x64-windows
      vcpkg_baseline: 42bb0d9e8d4cf33485afb9ee2229150f79f61a1f
      dep_folder: deps
      libplacebo_tag: v7.360.1
      sdl2_compat_tag: 2.32.64

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set vcpkg installed dir
        run: |
          echo "VCPKG_INSTALLED_DIR=${{ github.workspace }}\build\vcpkg_installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Vulkan
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ver = $null
          for ($i = 1; $i -le 3 -and -not $ver; $i++) {
            try { $ver = (Invoke-WebRequest -UseBasicParsing -Uri "https://vulkan.lunarg.com/sdk/latest.json" | ConvertFrom-Json).windows } catch { echo "Intento $i fallido, reintentando..."; Start-Sleep -Seconds 10 }
          }
          if (-not $ver) { throw "No se pudo obtener la version del Vulkan SDK" }
          echo Version $ver
          Invoke-WebRequest -UseBasicParsing -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe" -OutFile VulkanSDK.exe
          echo Downloaded
          .\VulkanSDK.exe --root ${{ env.VULKAN_SDK }}  --accept-licenses --default-answer --confirm-command install

      - name: Set up Ninja
        run: choco install ninja

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"
          host: 'windows'
          target: 'desktop'
          modules: 'qtwebengine qtpositioning qtwebchannel qtwebsockets qtserialport'

      - name: Install pip dependencies
        run: |
          ${{ env.pythonLocation }}\python.exe -m pip install --upgrade pip
          ${{ env.pythonLocation }}\python.exe -m pip install --upgrade setuptools wheel
          ${{ env.pythonLocation }}\python.exe -m pip install --user --upgrade scons protobuf grpcio-tools pyinstaller
          ${{ env.pythonLocation }}\python.exe -m pip install --user --upgrade meson
          ${{ env.pythonLocation }}\python.exe -c 'import google.protobuf; print(google.protobuf.__file__)'

      - name: Setup ffmpeg
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip" -OutFile ".\ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip"
          Expand-Archive -LiteralPath "ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip" -DestinationPath "."
          Rename-Item "ffmpeg-n7.1-latest-win64-gpl-shared-7.1" "${{ env.dep_folder }}"

      - name: Setup sdl2-compat
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri https://github.com/libsdl-org/sdl2-compat/releases/download/release-${{ env.sdl2_compat_tag }}/sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip -OutFile sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip
          Expand-Archive -Force -LiteralPath "sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip" -DestinationPath ".\sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64"
          Get-ChildItem -Path ".\sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64\*" -Include "*.dll" | Copy-Item -Force -Destination "${{ env.dep_folder }}\bin"

      - name: Build SPIRV-Cross
        run: |
          git clone https://github.com/KhronosGroup/SPIRV-Cross.git
          cd SPIRV-Cross
          cmake `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\${{ env.dep_folder }}" `
          -DSPIRV_CROSS_SHARED=ON `
          -S . `
          -B build `
          -G Ninja
          cmake --build build --config Release
          cmake --install build

      - name: Setup shaderc
        # El link viejo de google (storage.googleapis.com/shaderc/...) murio (404).
        # En su lugar se reutiliza el shaderc que ya trae el Vulkan SDK instalado arriba:
        # se replica el layout que espera el build (deps/include, deps/lib, deps/bin + .pc).
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $sdk = "${{ env.VULKAN_SDK }}"
          $deps = "${{ github.workspace }}\${{ env.dep_folder }}"
          New-Item -ItemType Directory -Force -Path "$deps\include\shaderc" | Out-Null
          New-Item -ItemType Directory -Force -Path "$deps\lib\pkgconfig" | Out-Null
          New-Item -ItemType Directory -Force -Path "$deps\bin" | Out-Null
          Copy-Item "$sdk\Include\shaderc\*" "$deps\include\shaderc\" -Force
          Copy-Item "$sdk\Lib\shaderc*.lib" "$deps\lib\" -Force
          Copy-Item "$sdk\Bin\shaderc_shared.dll" "$deps\bin\" -Force
          if (-not (Test-Path "$deps\bin\shaderc_shared.dll")) { throw "shaderc_shared.dll no encontrado en el Vulkan SDK" }
          $pc = @"
          prefix=`${pcfiledir}/../..
          exec_prefix=`${prefix}
          libdir=`${prefix}/lib
          includedir=`${prefix}/include

          Name: shaderc
          Description: Shader compilation library bundled with the Vulkan SDK
          Version: 2024.0
          Libs: -L`${libdir} -lshaderc_shared
          Cflags: -I`${includedir}
          "@
          $pc | Out-File -FilePath "$deps\lib\pkgconfig\shaderc.pc" -Encoding ascii
          ($pc -replace 'Name: shaderc','Name: shaderc_combined' -replace '-lshaderc_shared','-lshaderc_combined') | Out-File -FilePath "$deps\lib\pkgconfig\shaderc_combined.pc" -Encoding ascii
          echo "shaderc listo en $deps"

      - name: Make build directory
        run: |
          mkdir build

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-bin-${{ env.vcpkg_baseline }}-${{ env.triplet }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bin-${{ env.vcpkg_baseline }}-${{ env.triplet }}-${{ hashFiles('vcpkg.json') }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.vcpkg_baseline }}
          runVcpkgInstall: false
          vcpkgJsonGlob: "vcpkg.json"

      - name: Prebuild pkgconf
        # vcpkg_find_acquire_program(PKGCONFIG) intenta descargar un binario
        # msys2 (pkgconf 2.1.0) que MSYS2 ya borro de todos los mirrors (404).
        # Si la variable PKG_CONFIG existe, vcpkg la usa directo sin descargar.
        # Se precompila el puerto pkgconf en una carpeta APARTE (el install
        # principal en modo manifiesto borraria pkgconf por no estar en vcpkg.json)
        # y se exporta PKG_CONFIG + VCPKG_KEEP_ENV_VARS para que la variable
        # sobreviva la limpieza de entorno que vcpkg hace al compilar cada puerto.
        shell: pwsh
        run: |
          $vcpkgExe = "${{ github.workspace }}\vcpkg\vcpkg.exe"
          if (-not (Test-Path $vcpkgExe)) { $vcpkgExe = "$env:VCPKG_ROOT\vcpkg.exe" }
          if (-not (Test-Path $vcpkgExe)) { throw "vcpkg.exe no encontrado" }
          # En modo manifiesto vcpkg rechaza "install <paquete>" con argumentos.
          # Se usa un manifiesto temporal aparte para precompilar solo pkgconf.
          $prebuildDir = "${{ runner.temp }}\pkgconf-prebuild"
          New-Item -ItemType Directory -Force -Path $prebuildDir | Out-Null
          Set-Content -Path "$prebuildDir\vcpkg.json" -Value '{"name": "pkgconf-prebuild", "version": "1.0.0", "dependencies": ["pkgconf"]}'
          $prebuildRoot = "${{ github.workspace }}\build\pkgconf-prebuilt"
          & $vcpkgExe install --triplet ${{ env.triplet }} --x-manifest-root="$prebuildDir" --x-install-root="$prebuildRoot"
          if ($LASTEXITCODE -ne 0) { throw "fallo la precompilacion de pkgconf" }
          $pkgconfExe = "$prebuildRoot\${{ env.triplet }}\tools\pkgconf\pkgconf.exe"
          if (-not (Test-Path $pkgconfExe)) { throw "pkgconf.exe no quedo en $pkgconfExe" }
          "PKG_CONFIG=$pkgconfExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_KEEP_ENV_VARS=PKG_CONFIG" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PKG_CONFIG=$pkgconfExe"

      - name: Install vcpkg deps
        shell: pwsh
        run: |
          $vcpkgExe = "${{ github.workspace }}\vcpkg\vcpkg.exe"
          if (-not (Test-Path $vcpkgExe)) { $vcpkgExe = "$env:VCPKG_ROOT\vcpkg.exe" }
          if (-not (Test-Path $vcpkgExe)) { throw "vcpkg.exe no encontrado" }
          & $vcpkgExe install --triplet ${{ env.triplet }} --x-install-root="${{ github.workspace }}\build\vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { throw "fallo la instalacion de dependencias vcpkg" }

      - name: Build libplacebo
        run: |
          git clone --recursive https://github.com/haasn/libplacebo.git
          cd libplacebo
          git checkout --recurse-submodules ${{ env.libplacebo_tag }}
          meson setup `
          --prefix "${{ github.workspace }}\${{ env.dep_folder }}" `
          --native-file ../meson.ini `
          "--pkg-config-path=['${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\lib\pkgconfig','${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\share\pkgconfig','${{ github.workspace }}\${{ env.dep_folder }}\lib\pkgconfig']" `
          "--cmake-prefix-path=['${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}', '${{ env.VULKAN_SDK }}', '${{ github.workspace }}\${{ env.dep_folder }}']" `
          -Dc_args="/I ${{ env.VULKAN_SDK }}Include" `
          -Dcpp_args="/I ${{ env.VULKAN_SDK }}Include" `
          -Dc_link_args="/LIBPATH:${{ env.VULKAN_SDK }}Lib" `
          -Dcpp_link_args="/LIBPATH:${{ env.VULKAN_SDK }}Lib" `
          -Ddemos=false `
          ./build
          ninja -C./build
          ninja -C./build install

      - name: Apply Patches
        run: |
          git apply --ignore-whitespace --verbose --directory=third-party/gf-complete/ scripts/windows-vc/gf-complete.patch

      - name: Configure chiaki-ng
        run: |
          cmake `
          -S . `
          -B build `
          -G Ninja `
          -DCMAKE_TOOLCHAIN_FILE:STRING="vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE `
          -DCMAKE_BUILD_TYPE=Release `
          -DCHIAKI_ENABLE_CLI=OFF `
          -DCHIAKI_GUI_ENABLE_SDL_GAMECONTROLLER=ON `
          -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF `
          -DPYTHON_EXECUTABLE="${{ env.pythonLocation }}\python.exe" `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}\${{ env.dep_folder }};${{ env.VULKAN_SDK }}"

      - name: Build chiaki-ng
        run: |
          cmake --build build --config Release --clean-first --target chiaki

      - name: Prepare Qt deployment package
        run: |
          mkdir chiaki-ng-Win
          cp build\gui\chiaki.exe chiaki-ng-Win
          cp build\third-party\cpp-steam-tools\cpp-steam-tools.dll chiaki-ng-Win
          cp scripts\qtwebengine_import.qml gui\src\qml\
          $dll_patterns = @(
            "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\libcrypto-*-x64.dll",
            "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\libssl-*-x64.dll",
            "${{ github.workspace }}\${{ env.dep_folder }}\bin\SDL2.dll",
            "${{ github.workspace }}\${{ env.dep_folder }}\bin\SDL3.dll",
            "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\hidapi.dll",
            "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\fftw3.dll",
            "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\opus.dll",
            "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\libspeexdsp.dll",
            "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\lcms2.dll",
            "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\miniupnpc.dll",
            "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\json-c.dll",
            "${{ github.workspace }}\${{ env.dep_folder }}\bin\swresample-*.dll",
            "${{ github.workspace }}\${{ env.dep_folder }}\bin\avcodec-*.dll",
            "${{ github.workspace }}\${{ env.dep_folder }}\bin\avutil-*.dll",
            "${{ github.workspace }}\${{ env.dep_folder }}\bin\avformat-*.dll",
            "${{ github.workspace }}\${{ env.dep_folder }}\bin\libplacebo-*.dll",
            "${{ github.workspace }}\${{ env.dep_folder }}\bin\shaderc_shared.dll",
            "${{ github.workspace }}\${{ env.dep_folder }}\bin\spirv-cross-c-shared.dll"
          )
          foreach ($pattern in $dll_patterns) {
            $files = Get-Item $pattern -ErrorAction SilentlyContinue
            if ($files) {
              Copy-Item $pattern chiaki-ng-Win
            } else {
              Write-Warning "DLL no encontrada, se omite (probablemente enlazada estaticamente): $pattern"
            }
          }
          windeployqt.exe --no-translations --qmldir=gui\src\qml --release chiaki-ng-Win\chiaki.exe

      - name: Package chiaki-ng
        run: |
          $CHIAKI_VERSION_MAJOR = (Select-String -Path .\CMakeLists.txt -Pattern 'set\(CHIAKI_VERSION_MAJOR ([0-9]+)\)') | %{$_.Matches.Groups[1].value}
          $CHIAKI_VERSION_MINOR = (Select-String -Path .\CMakeLists.txt -Pattern 'set\(CHIAKI_VERSION_MINOR ([0-9]+)\)') | %{$_.Matches.Groups[1].value}
          $CHIAKI_VERSION_PATCH = (Select-String -Path .\CMakeLists.txt -Pattern 'set\(CHIAKI_VERSION_PATCH ([0-9]+)\)') | %{$_.Matches.Groups[1].value}
          $RELEASE_PACKAGE_FILE = "chiaki-ng-win_x64-VC-portable-$CHIAKI_VERSION_MAJOR.$CHIAKI_VERSION_MINOR.$CHIAKI_VERSION_PATCH-test-build-${{ github.sha }}.zip"
          Compress-Archive chiaki-ng-Win $RELEASE_PACKAGE_FILE
          $release_filepath = Get-ChildItem $RELEASE_PACKAGE_FILE | %{$_[0].FullName}
          echo "RELEASE_PACKAGE_PATH=$release_filepath" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-win_x64-VC-Release
          path: ${{ env.RELEASE_PACKAGE_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Compile .ISS to .EXE Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: "scripts/chiaki-ng.iss"
          options: /O+

      - name: Upload chiaki-ng Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-win_x64-VC-installer.zip
          path: chiaki-ng-windows-installer.exe
          if-no-files-found: error
          retention-days: 7

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-bin-${{ env.vcpkg_baseline }}-${{ env.triplet }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
